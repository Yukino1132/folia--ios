# .github/workflows/build-ios-ipa.yml
# 在 GitHub 的 macOS runner 上把 Capacitor iOS 工程打成未签名 IPA，作为构建产物（以及可选 Release 附件）发布。
# 触发：手动（workflow_dispatch）或推送与 ios 相关的改动。Windows/Linux 上没有 xcodebuild，
# 本 workflow 是唯一能一路编出 build/ios/Folia.ipa 的路径。

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      neteaseApiBase:
        description: '网易云 API 中转地址（可留空，应用内也能填）'
        required: false
        default: ''
      kugouApiBase:
        description: '酷狗 API 中转地址（可留空）'
        required: false
        default: ''
      qqApiBase:
        description: 'QQ 音乐 API 中转地址（可留空）'
        required: false
        default: ''
      lyricProxyBase:
        description: '歌词代理地址（可留空）'
        required: false
        default: ''
      publishRelease:
        description: '把 IPA 传到 Release（需要 contents: write）'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'src/ios/**'
      - 'scripts/ios/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios-ipa.yml'

permissions:
  contents: write


jobs:
  build-ipa:
    name: Archive and package IPA
    # macos-latest 是 arm64 的 Xcode 16 镜像，自带 CocoaPods；14 以上足够本项目 iOS 15 的目标。
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      FOLIA_NETEASE_API_BASE: ${{ inputs.neteaseApiBase }}
      FOLIA_KUGOU_API_BASE: ${{ inputs.kugouApiBase }}
      FOLIA_QQ_API_BASE: ${{ inputs.qqApiBase }}
      FOLIA_LYRIC_PROXY_BASE: ${{ inputs.lyricProxyBase }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-macos14-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts

      # 构建 Web 产物（相对路径 + 关 Service Worker），跑打包脚本注入后端地址，再同步进 ios/App/App/public。
      - name: Build web assets for the native shell
        run: npm run build:ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      # 复用 build-ipa.mjs：它自己会检查环境、archive（未签名）、拼 Payload 并打包成 ipa。
      - name: Archive and package IPA
        run: node scripts/ios/build-ipa.mjs --skip-build

      - name: Show artifact
        run: ls -lh build/ios/Folia.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folia-unsigned-ipa
          path: build/ios/Folia.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Folia-xcarchive
          path: build/ios/App.xcarchive
          if-no-files-found: ignore
          retention-days: 7

      # 打 tag 或手动勾选 publishRelease 时，把 IPA 附到 Release 上，方便直接下载。
      - name: Publish to Release
        if: inputs.publishRelease == true || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/Folia.ipa
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}
          name: Folia iOS ${{ github.ref_name }}
          draft: true
          body: |
            未签名 IPA，可用 Sideloadly / AltStore / TrollStore 等注入自己的证书安装。

            构建于 ${{ github.sha }}。
