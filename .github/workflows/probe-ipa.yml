# .github/workflows/probe-ipa.yml
# 临时探针：最小化触发条件，确认 macOS runner 是否可用。验证完即删除。

name: Probe macOS runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/probe-ipa.yml'

jobs:
  probe-linux:
    name: Probe linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hello
        run: uname -a

  probe-macos-latest:
    name: Probe macos-latest
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Hello
        run: |
          uname -a
          xcodebuild -version || true

  probe-macos-15:
    name: Probe macos-15
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Hello
        run: |
          uname -a
          xcodebuild -version || true
